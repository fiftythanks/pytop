[project]
name = "pytop"
version = "0.1.0"
description = "An experimental, pure-Python Linux system monitor built from scratch. Inspired by the layout and UI of [btop](https://github.com/aristocratos/btop)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pytop = "pytop.__main__:main"

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "single"
skip-magic-trailing-comma = true

[tool.basedpyright]
typeCheckingMode = "strict"
extraPaths = ['src']

[tool.pytest]
pythonpath = ["src"]
strict = true
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]


[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "prek>=0.5.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]
